<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PyCM References Links</title>
    <script>
        const links = {
            1: "https://google.com",
            2: "https://www.pycm.io",
            3: "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.confusion_matrix.html",
            4: "http://rasbt.github.io/mlxtend/user_guide/evaluate/lift_score/",
            5: "https://rdrr.io/rforge/mlearning/man/confusion.html",
            6: "https://www.alias-i.com/",
            7: "https://slideplayer.com/slide/6056877/",
            8: "https://www.slideserve.com/sandra_john/sociology-5811-lecture-16-crosstabs-2-measures-of-association-powerpoint-ppt-presentation",
            9: "https://epitools.ausvet.com.au/ciproportion?page=CIProportion",
            10: "http://www.real-statistics.com/descriptive-statistics/roc-curve-classification-table/auc-confidence-interval/",
            11: "https://davetang.org/muse/2017/09/21/adjusted-rand-index/",
            12: "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.adjusted_rand_score.html",
            13: "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.f1_score.html",
            14: "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.classification_report.html#sklearn.metrics.classification_report",
            15: "http://www.real-statistics.com/reliability/interrater-reliability/weighted-cohens-kappa/",
            16: "https://cran.r-project.org/web/packages/irrCAC/vignettes/overview.html",
            17: "https://brain.mcmaster.ca/SDT/dprime.html",
            18: "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.brier_score_loss.html",

            21: "https://www.omnicalculator.com/other/hamming-distance?c=IRR&v=select:0.000,b:1011010101,a:1101001111",
            22: "https://abydos.readthedocs.io/en/latest/abydos.distance.html#abydos.distance.BraunBlanquet",

            26: "https://abydos.readthedocs.io/en/latest/abydos.distance.html"
        };

        const params = new URLSearchParams(window.location.search);
        const n = params.get("n");

        window.onload = function () {
            if (n && links[n]) {
                window.location.replace(links[n]);
            } else {
                document.getElementById("message").textContent = "Invalid or missing reference link.";
            }
        };
    </script>
</head>
<body style="text-align:center;">
    <p id="message">Redirecting...</p>
</body>
</html>
